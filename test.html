<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Trading Chart</title>
<!-- TradingView Lightweight Charts -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: #0d1117; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  
  /* Header */
  .header { background: #161b22; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
  .pair-name { font-size: 20px; font-weight: bold; color: #58a6ff; }
  .balance { font-size: 16px; color: #3fb950; font-weight: bold; }
  
  /* Chart Area */
  #chart-container { flex-grow: 1; position: relative; }
  
  /* Bottom Controls */
  .controls { background: #161b22; padding: 15px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid #30363d; }
  .trade-btn { padding: 15px 40px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; text-transform: uppercase; }
  .btn-buy { background: #238636; }
  .btn-buy:hover { background: #2ea043; }
  .btn-sell { background: #da3633; }
  .btn-sell:hover { background: #f85149; }
  
  /* Timer Box */
  .timer-box { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.8); padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #30363d; z-index: 10; display: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="pair-name">USDPKR-OTC</div>
    <div class="balance">Balance: <span id="balance">$10,000.00</span></div>
  </div>

  <div id="chart-container">
    <div class="timer-box" id="timerBox">Trade Open: <span id="timer">60</span>s</div>
  </div>

  <div class="controls">
    <button class="trade-btn btn-sell" onclick="placeTrade('sell')">Sell (Put)</button>
    <button class="trade-btn btn-buy" onclick="placeTrade('buy')">Buy (Call)</button>
  </div>

<script>
  // 🔴 YAHAN APNI DETAILS DAALO
  const USER_ID = "1001";         // Jo user admin panel se banaya hai
  const PAIR = "USDPKR-OTC";      // Jo pair banaya hai
  const API_URL = `https://zeetex-chart.vercel.app/api/chart/${PAIR}?id=${USER_ID}&tf=1m`;

  // 1. Chart Setup
  const chartContainer = document.getElementById('chart-container');
  const chart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
    layout: { backgroundColor: '#0d1117', textColor: '#c9d1d9' },
    grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#30363d' },
    rightPriceScale: { borderColor: '#30363d' },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#3fb950', downColor: '#f85149', borderVisible: false,
    wickUpColor: '#3fb950', wickDownColor: '#f85149',
  });

  // Responsive chart
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
  });

  // 2. Data Fetch & Update Logic
  let currentCandleTime = 0;
  let lastCandle = null;

  async function fetchChartData() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      if (data.status) {
        const candles = data.candle;
        const last = candles[candles.length - 1];
        
        // Update Balance
        document.getElementById('balance').innerText = `$${Number(data.stats.balance).toFixed(2)}`;

        if (currentCandleTime !== last.time) {
          // Naya candle bana hai
          candleSeries.setData(candles);
          currentCandleTime = last.time;
        } else {
          // Same candle update ho rahi hai (Live ticking)
          candleSeries.update(last);
        }
        lastCandle = last;
      } else {
        console.error("API Error:", data.message);
      }
    } catch (err) {
      console.error("Fetch Error:", err);
    }
  }

  // Har 1 second baad data fetch karo (Live update ke liye)
  fetchChartData();
  setInterval(fetchChartData, 1000);

  // 3. Trade Execute Logic
  let tradeInterval;
  async function placeTrade(direction) {
    const amount = 100; // Default trade amount
    const btn = event.target;
    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
      const res = await fetch('https://zeetex-chart.vercel.app/api/trade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: USER_ID,
          pair: PAIR,
          direction: direction,
          amount: amount,
          duration: 60 // 60 seconds trade
        })
      });
      const data = await res.json();
      
      if (data.status) {
        // Trade lag gaya! Timer chalao
        startTimer(60);
        document.getElementById('balance').innerText = `$${Number(data.newBalance).toFixed(2)}`;
      } else {
        alert("Trade Failed: " + data.message);
      }
    } catch (err) {
      alert("Error placing trade. Check console.");
    } finally {
      btn.disabled = false;
      btn.innerText = direction === 'buy' ? 'Buy (Call)' : 'Sell (Put)';
    }
  }

  function startTimer(seconds) {
    const timerBox = document.getElementById('timerBox');
    const timerText = document.getElementById('timer');
    timerBox.style.display = 'block';
    let timeLeft = seconds;
    
    clearInterval(tradeInterval);
    tradeInterval = setInterval(() => {
      timeLeft--;
      timerText.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(tradeInterval);
        timerBox.style.display = 'none';
        // Yahan hum baad mein check karenge ke trade win hua ya loss
      }
    }, 1000);
  }

</script>
</body>
</html>
