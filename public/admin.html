<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeetex Admin</title>
<style>
  * { box-sizing: border-box; font-family: sans-serif; }
  body { background: #0a0e17; color: #e6edf3; padding: 20px; margin: 0; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: #22d3ee; }
  h2 { color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-top: 30px;}
  .card { background: #131a26; border: 1px solid #1f2937; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #1f2937; background: #0f1720; color: white; }
  button { background: #0891b2; cursor: pointer; font-weight: bold; border: none; }
  button:hover { background: #06b6d4; }
  button.danger { background: #dc2626; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;}
  th, td { padding: 10px; border-bottom: 1px solid #1f2937; text-align: left; }
  th { color: #94a3b8; }
  .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .on { background: #166534; color: #86efac; } .off { background: #7f1d1d; color: #fca5a5; }
  .status { font-size: 13px; margin-top: 5px; color: #3fb950; display: none;}
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ Zeetex Admin</h1>
  
  <div class="card">
    <div class="row">
      <input type="password" id="adminKey" placeholder="Admin Key" style="flex:1;" />
      <button onclick="saveKey()">Login</button>
    </div>
    <div id="keyMsg" class="status" style="color:#f85149;">Invalid Key</div>
  </div>

  <div id="appArea" style="display:none;">
    <!-- Candle Control -->
    <div class="card">
      <h2>Chart Control</h2>
      <div class="row">
        <label>Bias (0=Normal, 1=Up, -1=Down):</label>
        <input type="range" id="bias" min="-1" max="1" step="0.1" value="0" oninput="document.getElementById('biasVal').innerText=this.value">
        <span id="biasVal">0</span>
      </div>
      <div class="row">
        <label>Volatility Speed:</label>
        <input type="range" id="vol" min="0.1" max="3" step="0.1" value="1" oninput="document.getElementById('volVal').innerText=this.value">
        <span id="volVal">1</span>
      </div>
      <button onclick="saveSettings()">Save Chart Settings</button>
    </div>

    <!-- Pairs -->
    <div class="card">
      <h2>Pairs Management</h2>
      <div class="row">
        <input id="pName" placeholder="Pair Name (e.g. USDPKR-OTC)">
        <input id="pBase" type="number" placeholder="Base Price">
        <input id="pVol" type="number" placeholder="Volatility">
        <input id="pPay" type="number" placeholder="Payout %">
        <button onclick="savePair()">Add Pair</button>
      </div>
      <table>
        <thead><tr><th>Pair</th><th>Base</th><th>Payout</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="pairsBody"></tbody>
      </table>
    </div>

    <!-- Users -->
    <div class="card">
      <h2>Users Management</h2>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://zeetex-chart.vercel.app';
let adminKey = localStorage.getItem('adminKey') || '';

function h() { return { 'Content-Type': 'application/json', 'x-admin-key': adminKey }; }

async function saveKey() {
  adminKey = document.getElementById('adminKey').value;
  const res = await fetch(`${API}/api/admin/settings`, { headers: h() });
  if (res.ok) {
    localStorage.setItem('adminKey', adminKey);
    document.getElementById('appArea').style.display = 'block';
    document.getElementById('keyMsg').style.display = 'none';
    loadAll();
  } else {
    document.getElementById('keyMsg').style.display = 'block';
  }
}

async function loadAll() {
  // Settings
  const sRes = await fetch(`${API}/api/admin/settings`, { headers: h() });
  const sData = await sRes.json();
  if (sData.status) {
    document.getElementById('bias').value = sData.settings.candleBias || 0;
    document.getElementById('biasVal').innerText = sData.settings.candleBias || 0;
    document.getElementById('vol').value = sData.settings.volatilityMult || 1;
    document.getElementById('volVal').innerText = sData.settings.volatilityMult || 1;
  }

  // Pairs
  const pRes = await fetch(`${API}/api/admin/pairs`, { headers: h() });
  const pData = await pRes.json();
  if (pData.status) {
    document.getElementById('pairsBody').innerHTML = Object.keys(pData.pairs).map(k => `
      <tr>
        <td><b>${k}</b></td>
        <td>${pData.pairs[k].basePrice}</td>
        <td>${pData.pairs[k].payout}%</td>
        <td><span class="badge ${pData.pairs[k].active?'on':'off'}">${pData.pairs[k].active?'ON':'OFF'}</span></td>
        <td><button class="danger" onclick="delPair('${k}')">Delete</button></td>
      </tr>
    `).join('');
  }

  // Users
  const uRes = await fetch(`${API}/api/admin/users`, { headers: h() });
  const uData = await uRes.json();
  if (uData.status) {
    document.getElementById('usersBody').innerHTML = Object.keys(uData.users).map(k => `
      <tr>
        <td><b>${k}</b></td>
        <td>${uData.users[k].name}</td>
        <td>$${uData.users[k].balance}</td>
        <td><span class="badge ${uData.users[k].active?'on':'off'}">${uData.users[k].active?'ACTIVE':'BLOCKED'}</span></td>
        <td><button class="danger" onclick="delUser('${k}')">Delete</button></td>
      </tr>
    `).join('');
  }
}

async function saveSettings() {
  const body = {
    candleBias: document.getElementById('bias').value,
    volatilityMult: document.getElementById('vol').value
  };
  await fetch(`${API}/api/admin/settings`, { method: 'POST', headers: h(), body: JSON.stringify(body) });
  alert('Settings Saved!');
}

async function savePair() {
  const body = {
    pair: document.getElementById('pName').value,
    basePrice: document.getElementById('pBase').value,
    volatility: document.getElementById('pVol').value,
    payout: document.getElementById('pPay').value,
    active: true
  };
  await fetch(`${API}/api/admin/pairs`, { method: 'POST', headers: h(), body: JSON.stringify(body) });
  loadAll();
}

async function delPair(pair) {
  if(!confirm('Delete '+pair+'?')) return;
  await fetch(`${API}/api/admin/pairs?pair=${pair}`, { method: 'DELETE', headers: h() });
  loadAll();
}

async function delUser(id) {
  if(!confirm('Delete User '+id+'?')) return;
  await fetch(`${API}/api/admin/users?id=${id}`, { method: 'DELETE', headers: h() });
  loadAll();
}

if (adminKey) {
  document.getElementById('adminKey').value = adminKey;
  saveKey();
}
</script>
</body>
</html>
